name: Heavy tests

# Unit, integration, feature and simulation suites, benchmarks and the
# 2/4/6/8 GB load test, summarised in one HTML report uploaded as an artifact.
# The report is built and uploaded even when tests fail; the job still fails
# afterwards so the PR check stays honest.
#
# Runner selection follows ci.yml: repository variable CI_RUNS_ON (JSON),
# self-hosted Mac by default, '"ubuntu-latest"' for GitHub-hosted runners.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      profiles:
        description: RAM profiles in GB ("t" suffix = tuned variant)
        default: "2 4 6 8 2t"
      steps:
        description: Parallel clients per load step
        default: "10 50 100 200 400 800"
      step_duration:
        description: Duration of each load step
        default: 30s
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: heavy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heavy:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","ledgerbot"]') }}
    timeout-minutes: 120
    env:
      PERF_PROJECT: ledgerbot-perf-${{ github.run_id }}
      PERF_IMAGE: ledgerbot:perf-${{ github.run_id }}
      PERF_PROFILES: ${{ inputs.profiles || '2 4 6 8 2t' }}
      PERF_STEPS: ${{ inputs.steps || (github.event_name == 'pull_request' && '10 50 100 200 400') || '10 50 100 200 400 800' }}
      PERF_STEP_DURATION: ${{ inputs.step_duration || (github.event_name == 'pull_request' && '15s') || '30s' }}
      HEAVY_STRICT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run suites, benchmarks and load test
        run: ./scripts/heavy-test.sh
      - name: Job summary
        if: always()
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "No report was produced." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledgerbot-test-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
      - name: Fail if tests failed
        if: always()
        run: |
          test -f reports/summary.json || { echo "report missing"; exit 1; }
          if grep -q '"verdict": "FAIL"' reports/summary.json; then echo "tests failed, see the report artifact"; exit 1; fi
      - name: Clean up containers
        if: always()
        run: |
          docker compose -f loadtest/perf/compose.yml down -v --remove-orphans || true
          docker image rm "$PERF_IMAGE" || true
