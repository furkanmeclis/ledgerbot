version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - unconvert
  settings:
    misspell:
      ignore-rules: [adres, personel]
    gosec:
      excludes:
        - G104 # unhandled errors on best-effort writes are deliberate (`_ =`)
        - G304 # seed files are read from a configured directory
        - G404 # math/rand is used for the simulator and seed data only
  exclusions:
    presets: [comments, std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, bodyclose]
formatters:
  enable: [gofmt]
